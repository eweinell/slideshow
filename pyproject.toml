[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slideshow"
version = "0.1.0"
description = "Musiksynchroner 4K-Slideshow-Renderer fuer Urlaubsmaterial"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
    "pydantic>=2",
    "pillow",
    "rich",
    "soundfile",
]

[project.optional-dependencies]
# numba/llvmlite haben pro Python-Version eigene Wheels. Ohne untere Grenze
# backtrackt der Resolver bis in uralte sdists (numba 0.53.1), die beim Bauen
# mit "only versions >=3.6,<3.10 are supported" abbrechen. numba>=0.62 zwingt
# den Resolver stattdessen dazu, numpy passend zu waehlen (numba braucht <2.5).
librosa = ["librosa>=0.11", "numba>=0.62"]
aubio = ["aubio"]
# Nur fuer `slideshow analyze`. Bewusst optional: `build` und `render` laufen
# ohne das SDK, und die Testsuite laeuft ohne Netzzugriff (Abnahmekriterium A5).
vision = ["anthropic>=0.60"]
dev = ["pytest"]

[project.scripts]
slideshow = "slideshow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: laeuft mit echten ffmpeg-Encodes, dauert laenger",
    "manual: dokumentierter manueller Sichtpruefungs-Check",
]
